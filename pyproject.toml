[project]
name = "acumbamail"
version = "0.5.0"
description = "Acumamail SDK client for Python"
authors = [
    {name = "Daniel Alfocea (cr0hn)", email = "daniel@danielalfocea.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.13",
    "pyyaml>=6.0.1",
    "typer>=0.15.0",
]

[project.optional-dependencies]
# Browser automation (email+password login) for the automation client and CLI.
browser = [
    "playwright>=1.40.0",
    "undetected-chromedriver>=3.5.5",
]

[project.scripts]
acumbamail = "acumbamail.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Working notes and editor/agent config: no business being in a published artifact.
exclude = [
    "BUGS-*.md",
    ".claude",
    ".vscode/**",
    ".worktrees",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "openapi-spec-validator>=0.8.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "mypy>=1.13",
    "types-PyYAML",
    "playwright>=1.40.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not contract'"
markers = [
    "contract: tests de contrato contra la API real (requieren red)",
]

[tool.mypy]
strict = true
files = ["acumbamail"]
